<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Surge Budget full splash: mark + wordmark + tagline on the brand background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0E2A2A"/>
      <stop offset="1" stop-color="#04070F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>

    <radialGradient id="face" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#1F6B57"/>
      <stop offset="1" stop-color="#0B2A26"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.55" stop-color="#9CA3AF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="540" cy="760" r="380" fill="url(#glow)"/>
  <g transform="translate(284,504)">
  <circle cx="236" cy="276" r="150" fill="none" stroke="url(#ring)" stroke-width="26"/>
  <circle cx="236" cy="276" r="118" fill="url(#face)" stroke="#34D399" stroke-width="10"/>
  <text x="200" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="120" fill="#6EE7B7">$</text>
  <!-- dark cut-out under the arrow so it reads above the coin -->
  <polyline points="70,440 205,305 255,355 400,210" fill="none" stroke="#04070F" stroke-width="64" stroke-linejoin="miter" stroke-linecap="round"/>
  <polygon points="452,140 430,270 330,180" fill="#04070F" stroke="#04070F" stroke-width="22" stroke-linejoin="round"/>
  <polyline points="70,440 205,305 255,355 400,210" fill="none" stroke="url(#arrow)" stroke-width="36" stroke-linejoin="miter" stroke-linecap="round"/>
  <polygon points="452,140 425,260 335,182" fill="#A7F3D0"/>
<g id="mascot" transform="translate(343.5,30) scale(0.97)">
  <!-- Surge Budget mascot (body, without the waving arm). Pseudo-3D via gradients. -->
  <defs>
    <linearGradient id="rb_metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#D7E0EA"/>
      <stop offset="1" stop-color="#8A99AD"/>
    </linearGradient>
    <linearGradient id="rb_metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C5D0DC"/>
      <stop offset="1" stop-color="#6B7A90"/>
    </linearGradient>
    <radialGradient id="rb_glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="0.5" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </radialGradient>
    <linearGradient id="rb_visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <line x1="50" y1="9" x2="50" y2="22" stroke="url(#rb_metalDark)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="7" r="6" fill="url(#rb_glow)"/>
  <circle cx="48" cy="5" r="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <!-- ears -->
  <circle cx="17" cy="43" r="6" fill="url(#rb_metalDark)"/>
  <circle cx="83" cy="43" r="6" fill="url(#rb_metalDark)"/>
  <!-- head -->
  <rect x="18" y="20" width="64" height="46" rx="20" fill="url(#rb_metal)"/>
  <ellipse cx="34" cy="28" rx="12" ry="5" fill="#FFFFFF" fill-opacity="0.7"/>
  <!-- visor + eyes + smile -->
  <rect x="25" y="32" width="50" height="25" rx="12.5" fill="url(#rb_visor)"/>
  <ellipse cx="40" cy="43" rx="5.5" ry="6.5" fill="url(#rb_glow)"/>
  <ellipse cx="60" cy="43" rx="5.5" ry="6.5" fill="url(#rb_glow)"/>
  <circle cx="38.5" cy="41" r="1.6" fill="#FFFFFF"/>
  <circle cx="58.5" cy="41" r="1.6" fill="#FFFFFF"/>
  <path d="M44 51 Q50 55 56 51" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="43" y="64" width="14" height="7" rx="3" fill="url(#rb_metalDark)"/>
  <!-- left arm: hand on hip (style pose) -->
  <path d="M31 77 Q13 88 25 104" fill="none" stroke="url(#rb_metalDark)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="26" cy="104" r="6" fill="url(#rb_metal)"/>
  <!-- torso -->
  <rect x="27" y="69" width="46" height="42" rx="15" fill="url(#rb_metal)"/>
  <ellipse cx="40" cy="76" rx="9" ry="4" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="50" cy="89" r="8" fill="#0B1220"/>
  <circle cx="50" cy="89" r="5.5" fill="url(#rb_glow)"/>
  <!-- legs: wide confident stance -->
  <rect x="33" y="107" width="11" height="22" rx="5" fill="url(#rb_metalDark)" transform="rotate(8 38 107)"/>
  <rect x="56" y="107" width="11" height="22" rx="5" fill="url(#rb_metalDark)" transform="rotate(-8 62 107)"/>
  <ellipse cx="35" cy="133" rx="11" ry="6" fill="url(#rb_metal)"/>
  <ellipse cx="65" cy="133" rx="11" ry="6" fill="url(#rb_metal)"/>

<g transform="translate(59,31) rotate(34 15 46)">
  <!-- Surge Budget mascot waving arm; pivot = bottom centre (15,46) at the shoulder. -->
  <defs>
    <linearGradient id="rb_armMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C5D0DC"/>
      <stop offset="1" stop-color="#6B7A90"/>
    </linearGradient>
    <linearGradient id="rb_handMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <line x1="15" y1="46" x2="15" y2="16" stroke="url(#rb_armMetal)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="15" cy="11" r="8" fill="url(#rb_handMetal)"/>
  <rect x="9" y="1" width="3.5" height="7" rx="1.75" fill="url(#rb_handMetal)"/>
  <rect x="13.5" y="0" width="3.5" height="7" rx="1.75" fill="url(#rb_handMetal)"/>
  <rect x="18" y="1" width="3.5" height="7" rx="1.75" fill="url(#rb_handMetal)"/>
</g></g>
<g id="hi-bubble"><rect x="246" y="26" width="92" height="50" rx="20" fill="#ECFDF5"/><polygon points="330,44 356,56 330,62" fill="#ECFDF5"/>
<text x="292" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#064E3B">Hi!</text></g></g>
  <text x="540" y="1150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="96" letter-spacing="2" fill="url(#word)">Surge Budget</text>
  <text x="540" y="1225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" letter-spacing="6" fill="#A7F3D0" fill-opacity="0.75">YOUR AI MONEY AGENT</text>
</svg>
