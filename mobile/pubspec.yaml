name: budget_agent
description: "AI-powered personal budget agent with deterministic double-entry offline ledger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local Persistence & SQLite (Drift)
  drift: ^2.24.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Firebase Authentication & App Attestation
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  firebase_app_check: ^0.3.2
  firebase_crashlytics: ^4.3.0
  google_sign_in: ^6.2.2

  # Networking
  dio: ^5.7.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  timezone: ^0.9.4
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1

  # Data Visualization
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
